version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        - node scripts/generate-environment.mjs
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/tryckers-frontend/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
