<div class="post-page" *ngIf="!loading && !error && post; else stateBlock">
  <header class="post-header">
    <div class="post-meta">
      <span class="post-type">{{ post?.type || 'Artículo' }}</span>
      <span
        class="post-status"
        [class.published]="post?.status === 'published'"
      >
        {{ post?.status || 'borrador' }}
      </span>
    </div>
    <h1 class="post-title">{{ post?.title }}</h1>
    <div class="post-submeta">
      <span class="post-author"
        >Por {{ post?.author?.username || post?.user?.name || 'Autor' }}</span
      >
      <span class="post-date" *ngIf="post?.created_at"
        >{{ post.created_at | date:'mediumDate' }}</span
      >
    </div>
    <div class="post-tags" *ngIf="toArray(post?.tags).length">
      <span class="tag" *ngFor="let tag of toArray(post?.tags)"
        >#{{ tag }}</span
      >
    </div>
  </header>

  <figure class="post-hero" *ngIf="post?.image">
    <img [src]="post.image" [alt]="post?.title || 'Imagen de la publicación'" />
  </figure>

  <article class="post-content">
    <p>{{ post?.content }}</p>
  </article>

  <footer class="post-footer">
    <div class="post-actions">
      <button
        type="button"
        class="vote-btn upvote"
        [class.voted]="post?.user_vote === 1"
        title="Upvote"
        (click)="votePost(post.id)"
      >
        <span>👍 {{ post?.user_vote === 1 ? 'Quitar voto' : 'Votar' }}</span>
        <span class="vote-count">{{ post?.votes_count ?? 0 }} votos</span>
      </button>
      <a
        [routerLink]="[
          '/profile',
          username || post?.author?.username || post?.user?.username || ''
        ]"
        class="post-action-link"
      >
        Ver perfil autor
      </a>
      <a [routerLink]="backCommands" class="post-action-link secondary">
        {{ backLabel }}
      </a>
    </div>
  </footer>
</div>

<ng-template #stateBlock>
  <div class="state" *ngIf="loading">Cargando publicación...</div>
  <div class="state error" *ngIf="!loading && error">{{ error }}</div>
</ng-template>
