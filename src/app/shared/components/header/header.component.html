<!-- Header básico -->
<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <div class="logo">
        <a routerLink="/home" class="logo-link">Tryckers</a>
      </div>

      <button
        type="button"
        class="mobile-menu-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="main-nav"
        aria-label="Abrir o cerrar menu de navegacion"
      >
        {{ mobileMenuOpen() ? "✕" : "☰" }}
      </button>

      @if (authStore.isLoggedIn()) {
        <!-- Navigation -->
        <nav id="main-nav" class="nav" [class.nav-open]="mobileMenuOpen()">
          <a
            routerLink="/cartelera"
            class="nav-link"
            routerLinkActive="nav-link-active"
            (click)="closeMobileMenu()"
            >Cartelera</a
          >
        </nav>
      }

      <!-- Right side -->
      <div class="header-actions" [class.actions-open]="mobileMenuOpen()">
        <!-- Theme toggle button -->
        <button
          (click)="toggleTheme()"
          class="theme-toggle"
          [attr.aria-label]="
            isDarkMode() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'
          "
          title="Cambiar tema"
        >
          @if (isDarkMode()) {
            <span class="theme-icon">☀️</span>
          } @else {
            <span class="theme-icon">🌙</span>
          }
        </button>

        <!-- Authentication buttons -->
        <ng-container *ngIf="!authStore.isLoggedIn()">
          <button
            type="button"
            routerLink="/auth/login"
            class="btn btn-outline"
            (click)="closeMobileMenu()"
            aria-label="Ir a iniciar sesion"
          >
            LOGIN
          </button>
          <button
            type="button"
            routerLink="/auth/register"
            class="btn btn-primary"
            (click)="closeMobileMenu()"
            aria-label="Ir a registro"
          >
            REGISTRO
          </button>
        </ng-container>

        <!-- User menu -->
        <ng-container *ngIf="authStore.isLoggedIn()">
          <div class="user-menu">
            <button
              (click)="toggleDropdown()"
              class="user-button"
              [attr.aria-expanded]="dropdownOpen()"
              aria-controls="user-dropdown"
              aria-label="Abrir menu de usuario"
            >
              <div class="avatar"></div>
              <span class="username">
                {{ authStore.user()?.name || "Usuario" }}
              </span>
              <span class="dropdown-icon">{{
                dropdownOpen() ? "▲" : "▼"
              }}</span>
            </button>

            <!-- Dropdown menu -->
            @if (dropdownOpen()) {
              <div id="user-dropdown" class="dropdown-menu" role="menu">
                <a
                  [routerLink]="profileLink"
                  class="dropdown-item"
                  routerLinkActive="dropdown-item-active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  (click)="closeDropdown(); closeMobileMenu()"
                  role="menuitem"
                >
                  Perfil
                </a>
                <a
                  routerLink="/settings"
                  class="dropdown-item"
                  routerLinkActive="dropdown-item-active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  (click)="closeDropdown(); closeMobileMenu()"
                  role="menuitem"
                >
                  Configuración
                </a>
                <button
                  (click)="logout(); closeDropdown(); closeMobileMenu()"
                  class="dropdown-item dropdown-button"
                  role="menuitem"
                  aria-label="Cerrar sesion"
                >
                  Cerrar sesión
                </button>
              </div>
            }
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</header>
